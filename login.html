<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AI Presentation Analyzer - Login</title>

    <link rel="stylesheet" href="style.css">
</head>

<body class="login-page">

    <div class="login-container">

        <!-- LEFT SIDE -->

        <div class="login-info">

            <div class="big-icon">🎤</div>

            <h1>AI Presentation<br>Analyzer</h1>

            <p>
                Improve your presentation skills using
                Artificial Intelligence.
            </p>

            <div class="feature">
                🎙️ Speech-to-Text
            </div>

            <div class="feature">
                ⚡ Speaking Speed Analysis
            </div>

            <div class="feature">
                🔍 Filler Word Detection
            </div>

            <div class="feature">
                😊 Emotion & Sentiment
            </div>

            <div class="feature">
                ⭐ Presentation Score
            </div>

        </div>


        <!-- LOGIN FORM -->

        <div class="login-box">

            <h2>Welcome Back 👋</h2>

            <p class="login-subtitle">
                Login to analyze your presentation
            </p>

            <label>Email Address</label>

            <input
                type="email"
                id="email"
                placeholder="Enter your email"
            >


            <label>Password</label>

            <input
                type="password"
                id="password"
                placeholder="Enter your password"
            >


            <button onclick="login()">
                Login
            </button>

            <p id="loginMessage"></p>

        </div>

    </div>


    <script src="script.js"></script>

</body>
</html>
